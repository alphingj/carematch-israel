version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: carematch-db
    environment:
      POSTGRES_USER: carematch
      POSTGRES_PASSWORD: carematch
      POSTGRES_DB: carematch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carematch"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: carematch-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./carematch_backend
      dockerfile: Dockerfile
    container_name: carematch-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://carematch:carematch@postgres:5432/carematch
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - DEBUG=true
      - MODULE_AUTO_DISCOVER=true
      - MODULE_HOT_RELOAD=true
    ports:
      - "8000:8000"
    volumes:
      - ./carematch_backend:/app
      - ./carematch_backend/modules:/app/modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  admin:
    build:
      context: ./carematch_admin
      dockerfile: Dockerfile
    container_name: carematch-admin
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    ports:
      - "3001:3001"
    volumes:
      - ./carematch_admin:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

  celery:
    build:
      context: ./carematch_backend
      dockerfile: Dockerfile
    container_name: carematch-celery
    environment:
      - DATABASE_URL=postgresql+asyncpg://carematch:carematch@postgres:5432/carematch
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    command: celery -A core.celery_app worker --loglevel=info

volumes:
  postgres_data:
  redis_data: