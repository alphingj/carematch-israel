[project]
name = "carematch-backend"
version = "1.0.0"
description = "Carematch Israel - Modular Python Backend with Plugin Architecture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "email-validator>=2.1.0",
    "jinja2>=3.1.4",
    "watchdog>=4.0.0",
    "apscheduler>=3.10.4",
    "redis>=5.0.0",
    "celery>=5.4.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "faker>=25.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
test = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "faker>=25.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "faker>=25.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "ARG", "PTH", "PD", "PL", "TRY", "SIM", "T20", "ISC", "ICN", "PIE", "TID", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SLOT", "TCH", "INT", "ERA", "EXE", "FUR", "ISC", "LOG", "NPY", "PD", "PIE", "PL", "PT", "PTH", "PYI", "Q", "RSE", "RET", "SIM", "SLF", "SLOT", "T20", "TCH", "TID", "TRY", "UP", "W", "ARG", "B", "C4", "E", "F", "I", "N"]
ignore = ["E501", "B008", "C901", "ARG001", "ARG002", "TRY003", "PTH118", "PTH123", "S101"]
per-file-ignores = {
    "tests/*": ["S101", "SLF001"],
    "alembic/*": ["S101"],
}

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
enable_error_code = ["ignore-without-code"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"